services:
  - type: web
    name: backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DB_URL
        fromDatabase:
          name: consent-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: consent-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: consent-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: consent-db
    plan: free
